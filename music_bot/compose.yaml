services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      YTDLP_JS_RUNTIME: deno
      # Override stale .env values from the previous deployment recipe.
      YOUTUBE_PLAYER_CLIENT: ""
      YOUTUBE_POT_PROVIDER_URL: http://bgutil-provider:4416
    depends_on:
      bgutil-provider:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./temp:/app/temp

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
