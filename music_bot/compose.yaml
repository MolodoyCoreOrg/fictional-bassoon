services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      YTDLP_JS_RUNTIME: deno
      YOUTUBE_PLAYER_CLIENT: mweb
      YOUTUBE_POT_PROVIDER_URL: http://bgutil-provider:4416
    depends_on:
      - bgutil-provider
    volumes:
      - ./data:/app/data
      - ./temp:/app/temp

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    init: true
