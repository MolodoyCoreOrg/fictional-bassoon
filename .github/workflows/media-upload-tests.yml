name: Media upload regression tests

on:
  pull_request:
    paths:
      - "music_bot/**"
      - ".github/workflows/media-upload-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music_bot
    env:
      BOT_TOKEN: test-token
      TELEGRAM_API_BASE_URL: ""
      TELEGRAM_LOCAL_FILE_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: music_bot/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests including real media conversion
        run: python -m unittest discover -s tests -v
